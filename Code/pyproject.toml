[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachpatch"
version = "0.1.0"
description = "Graph-grounded single-incumbent reach-avoid program repair"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Research-only"}
authors = [{name = "ReachPatch Authors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "coverage>=7"]

[project.scripts]
reachpatch = "reachpatch.cli.main:main"

[tool.setuptools.packages.find]
include = ["reachpatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
addopts = "-ra"
